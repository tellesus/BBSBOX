name: Foundation experiment
on:
  push:
    paths: ['spikes/m00/**', 'crates/**', 'client/**', 'protocol/**', 'deploy/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/foundation.yml', 'tools/validate_roadmap.py', 'tools/verify_credentials.mjs', 'tools/verify_event_vectors.mjs', 'tools/verify_archive_vectors.mjs', 'tools/verify_release_vectors.mjs', 'tools/release_materials.py', 'tools/test_release_materials.py', 'tools/release_candidate.py', 'tools/test_release_candidate.py', 'tools/runtime_smoke.py', 'tools/runtime_bundle.py', 'tools/test_runtime_bundle.py', 'tools/test_install_development.py', 'tools/test_install_release.py', 'tools/test_update_release.py', 'tools/test_backup_development.py', 'tools/test_network_profile.py', 'tools/test_enrollment.py', 'tools/test_configure_network.py', 'tools/test_local_tls.py', 'tools/test_link_capture.py', 'docs/**']
  pull_request:
    paths: ['spikes/m00/**', 'crates/**', 'client/**', 'protocol/**', 'deploy/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/foundation.yml', 'tools/validate_roadmap.py', 'tools/verify_credentials.mjs', 'tools/verify_event_vectors.mjs', 'tools/verify_archive_vectors.mjs', 'tools/verify_release_vectors.mjs', 'tools/release_materials.py', 'tools/test_release_materials.py', 'tools/release_candidate.py', 'tools/test_release_candidate.py', 'tools/runtime_smoke.py', 'tools/runtime_bundle.py', 'tools/test_runtime_bundle.py', 'tools/test_install_development.py', 'tools/test_install_release.py', 'tools/test_update_release.py', 'tools/test_backup_development.py', 'tools/test_network_profile.py', 'tools/test_enrollment.py', 'tools/test_configure_network.py', 'tools/test_local_tls.py', 'tools/test_link_capture.py', 'docs/**']
permissions:
  contents: read
jobs:
  local-network-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -p test_network_profile.py -v
      - run: python3 -m unittest discover -s tools -p test_enrollment.py -v
      - run: python3 -m unittest discover -s tools -p test_configure_network.py -v
      - run: python3 -m unittest discover -s tools -p test_local_tls.py -v
      - run: python3 -m unittest discover -s tools -p test_link_capture.py -v
      - run: sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update && sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y nftables dnsmasq-base iproute2
        timeout-minutes: 5
      - run: sudo unshare --net -- bash -c 'ip link set lo up && python3 deploy/ci/network_boundary.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-network-boundary-evidence
          path: work/network-boundary/**
  local-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/m00
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: spikes/m00/web/.node-version
          cache: npm
          cache-dependency-path: spikes/m00/web/package-lock.json
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check --manifest-path node/Cargo.toml
      - run: cargo test --locked --manifest-path node/Cargo.toml
      - run: cargo clippy --locked --offline --manifest-path node/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --offline --manifest-path node/Cargo.toml
      - run: npm ci && npm run check && npm run build
        working-directory: spikes/m00/web
      - run: node ../../tools/verify_credentials.mjs
      - run: node ../../tools/verify_event_vectors.mjs
      - run: node ../../tools/verify_archive_vectors.mjs
      - run: node ../../tools/verify_release_vectors.mjs
      - run: python3 tools/init_tls.py
      - run: npx playwright install --with-deps chromium && npm test
        working-directory: spikes/m00/web
      - run: python3 -m unittest discover -s tools -p test_offline_smoke.py -v
      - run: sudo apt-get update && sudo apt-get install -y strace iproute2
      - run: sudo unshare --net -- bash -c 'ip link set lo up && python3 tools/offline_smoke.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-runtime-evidence
          path: |
            spikes/m00/.state/offline-evidence.json
            spikes/m00/.state/offline-ipv4.trace
            spikes/m00/.state/offline-ipv6.trace
      - run: python3 tools/validate_roadmap.py
        working-directory: .
  encrypted-group-experiment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/m00
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check --manifest-path mls/Cargo.toml
      - run: cargo test --locked --manifest-path mls/Cargo.toml
      - run: cargo clippy --locked --offline --manifest-path mls/Cargo.toml --all-targets -- -D warnings
  storage-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check --all
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --offline --workspace --all-targets -- -D warnings
      - run: cargo build --locked --offline -p bbsbox-node-runtime --bins --examples
      - run: python3 -m unittest discover -s tools -p test_update_release.py -v
      - run: python3 -m unittest discover -s tools -p test_release_materials.py -v
      - run: python3 -m unittest discover -s tools -p test_release_candidate.py -v
      - run: cargo vendor --locked --versioned-dirs work/release-vendor
      - run: python3 tools/release_materials.py build --vendor work/release-vendor --output work/release-materials > work/release-materials-evidence.json
      - run: python3 -m unittest discover -s tools -p test_runtime_bundle.py -v
      - run: python3 tools/runtime_bundle.py build --binary target/debug/bbsbox-node --output work/runtime-bundle
      - run: python3 tools/runtime_bundle.py verify work/runtime-bundle
      - run: python3 -m unittest discover -s tools -p test_install_development.py -v
      - run: python3 -m unittest discover -s tools -p test_install_release.py -v
      - run: python3 -m unittest discover -s tools -p test_backup_development.py -v
      - run: sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update && sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y strace iproute2 systemd-container
        timeout-minutes: 5
      - run: sudo unshare --net -- bash -c 'ip link set lo up && python3 tools/runtime_smoke.py --isolated'
      - run: target/debug/bbsbox-node --release-profile > work/release-candidate-profile.json
      - name: Rebuild matching materials with no network or dependency cache
        run: sudo unshare --net -- python3 deploy/ci/rebuild_release.py --root work/release-extracted --materials work/release-materials --source-commit "$GITHUB_SHA" --cargo "$(rustup which cargo)" --rustc "$(rustup which rustc)" --expected-profile work/release-candidate-profile.json --output work/offline-material-rebuild.json
      - name: Prepare and inspect an actual signed candidate in isolated networking
        run: sudo unshare --net -- python3 deploy/ci/check_release_candidate.py --tool target/debug/bbsbox-node --binary work/release-extracted/rebuild-target/debug/bbsbox-node --materials work/release-materials --source-commit "$GITHUB_SHA" --rebuild-evidence work/offline-material-rebuild.json --root work/signed-candidate-fixture --output work/signed-candidate-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-release-material-evidence
          path: |
            work/release-materials-evidence.json
            work/offline-material-rebuild.json
            work/offline-upgrade_*.json
            work/signed-candidate-evidence.json
            work/release-materials/notices.json
      - name: Release build-only storage before unpacking appliances
        run: |
          sudo rm -rf -- work/release-vendor work/release-extracted work/release-materials work/signed-candidate-fixture/verified work/signed-candidate-fixture/false-profile
          df -h .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-isolation-evidence
          path: work/runtime-evidence/*
      - run: python3 deploy/ci/prepare.py context --payload work/runtime-bundle --output work/install-context
      - run: docker build -t bbsbox-install-fixture work/install-context
        env:
          DOCKER_BUILDKIT: '1'
      - run: docker build --target prepared -t bbsbox-prepared-fixture work/install-context
        env:
          DOCKER_BUILDKIT: '1'
      - run: docker create --name bbsbox-install-export bbsbox-install-fixture
      - run: docker export bbsbox-install-export -o work/debian-root.tar
      - run: docker rm bbsbox-install-export
      - run: sudo python3 deploy/ci/prepare.py extract --archive work/debian-root.tar --output work/debian-root
      - run: rm -- work/debian-root.tar
      - run: sudo python3 deploy/ci/reinstall.py --root work/debian-root
      - run: sudo python3 deploy/ci/boot_service.py --root work/debian-root
      - run: python3 -c "import json; p=json.load(open('deploy/network.example.json')); p['hostname']='auto'; json.dump(p,open('work/network-install.json','w'))"
      - run: sudo unshare --net -- bash -c 'ip link set lo up && python3 deploy/configure_network.py --root work/debian-root --profile work/network-install.json --development && python3 deploy/ci/boot_network.py --root work/debian-root'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-install-service-evidence
          path: |
            work/debian-service-evidence.json
            work/reinstall-evidence.json
            work/debian-boot-*.log
            work/debian-network/**
      - run: sudo python3 deploy/ci/signed_context.py --fixture work/signed-candidate-fixture --verifier target/debug/bbsbox-node --output work/signed-install-context
      - run: docker build -t bbsbox-signed-install-fixture work/signed-install-context
        env:
          DOCKER_BUILDKIT: '1'
      - run: docker create --name bbsbox-signed-export bbsbox-signed-install-fixture
      - run: docker export bbsbox-signed-export -o work/signed-debian-root.tar
      - run: docker rm bbsbox-signed-export
      - run: docker image rm bbsbox-signed-install-fixture
      - run: sudo python3 deploy/ci/prepare.py extract --archive work/signed-debian-root.tar --output work/signed-debian-root
      - run: rm -- work/signed-debian-root.tar
      - run: sudo python3 deploy/ci/boot_service.py --root work/signed-debian-root --signed --output work/signed-debian-service-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-install-service-evidence
          path: |
            work/signed-debian-service-evidence.json
            work/debian-boot-*.log
      - name: Recover an older encrypted node snapshot onto separate offline Debian media
        run: sudo python3 deploy/ci/recover_service.py --source work/signed-debian-root --fixture work/signed-candidate-fixture --verifier target/debug/bbsbox-node --root work/source-loss-root --output work/source-loss-evidence
      - name: Reprovision local networking on the recovered appliance
        run: sudo unshare --net -- bash -c 'ip link set lo up && python3 deploy/configure_network.py --root work/source-loss-root --profile work/network-install.json --development && python3 deploy/ci/boot_network.py --root work/source-loss-root --output work/source-loss-evidence/network'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-appliance-evidence
          path: work/source-loss-evidence/**
      - run: cargo run --release --locked --offline --example writer_load > writer-load.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-load-observation
          path: writer-load.json
