name: Foundation experiment
on:
  push:
    paths: ['spikes/m00/**', 'crates/**', 'client/**', 'protocol/**', 'deploy/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/foundation.yml', 'tools/validate_roadmap.py', 'tools/verify_credentials.mjs', 'tools/verify_event_vectors.mjs', 'tools/runtime_smoke.py', 'tools/runtime_bundle.py', 'tools/test_runtime_bundle.py', 'tools/test_install_development.py', 'tools/test_network_profile.py', 'tools/test_enrollment.py', 'docs/**']
  pull_request:
    paths: ['spikes/m00/**', 'crates/**', 'client/**', 'protocol/**', 'deploy/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/foundation.yml', 'tools/validate_roadmap.py', 'tools/verify_credentials.mjs', 'tools/verify_event_vectors.mjs', 'tools/runtime_smoke.py', 'tools/runtime_bundle.py', 'tools/test_runtime_bundle.py', 'tools/test_install_development.py', 'tools/test_network_profile.py', 'tools/test_enrollment.py', 'docs/**']
permissions:
  contents: read
jobs:
  local-network-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -p test_network_profile.py -v
      - run: python3 -m unittest discover -s tools -p test_enrollment.py -v
      - run: sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update && sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y nftables dnsmasq-base iproute2
        timeout-minutes: 5
      - run: sudo unshare --net -- bash -c 'ip link set lo up && python3 deploy/ci/network_boundary.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-network-boundary-evidence
          path: work/network-boundary/**
  local-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/m00
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: spikes/m00/web/.node-version
          cache: npm
          cache-dependency-path: spikes/m00/web/package-lock.json
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check --manifest-path node/Cargo.toml
      - run: cargo test --locked --manifest-path node/Cargo.toml
      - run: cargo clippy --locked --offline --manifest-path node/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --offline --manifest-path node/Cargo.toml
      - run: npm ci && npm run check && npm run build
        working-directory: spikes/m00/web
      - run: node ../../tools/verify_credentials.mjs
      - run: node ../../tools/verify_event_vectors.mjs
      - run: python3 tools/init_tls.py
      - run: npx playwright install --with-deps chromium && npm test
        working-directory: spikes/m00/web
      - run: python3 -m unittest discover -s tools -p test_offline_smoke.py -v
      - run: sudo apt-get update && sudo apt-get install -y strace iproute2
      - run: sudo unshare --net -- bash -c 'ip link set lo up && python3 tools/offline_smoke.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-runtime-evidence
          path: |
            spikes/m00/.state/offline-evidence.json
            spikes/m00/.state/offline-ipv4.trace
            spikes/m00/.state/offline-ipv6.trace
      - run: python3 tools/validate_roadmap.py
        working-directory: .
  encrypted-group-experiment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/m00
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check --manifest-path mls/Cargo.toml
      - run: cargo test --locked --manifest-path mls/Cargo.toml
      - run: cargo clippy --locked --offline --manifest-path mls/Cargo.toml --all-targets -- -D warnings
  storage-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check --all
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --offline --workspace --all-targets -- -D warnings
      - run: cargo build --locked --offline -p bbsbox-node-runtime
      - run: python3 -m unittest discover -s tools -p test_runtime_bundle.py -v
      - run: python3 tools/runtime_bundle.py build --binary target/debug/bbsbox-node --output work/runtime-bundle
      - run: python3 tools/runtime_bundle.py verify work/runtime-bundle
      - run: python3 -m unittest discover -s tools -p test_install_development.py -v
      - run: sudo apt-get update && sudo apt-get install -y strace iproute2 systemd-container
      - run: sudo unshare --net -- bash -c 'ip link set lo up && python3 tools/runtime_smoke.py --isolated'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-isolation-evidence
          path: work/runtime-evidence/*
      - run: python3 deploy/ci/prepare.py context --payload work/runtime-bundle --output work/install-context
      - run: docker build -t bbsbox-install-fixture work/install-context
        env:
          DOCKER_BUILDKIT: '1'
      - run: docker create --name bbsbox-install-export bbsbox-install-fixture
      - run: docker export bbsbox-install-export -o work/debian-root.tar
      - run: docker rm bbsbox-install-export
      - run: sudo python3 deploy/ci/prepare.py extract --archive work/debian-root.tar --output work/debian-root
      - run: sudo python3 deploy/ci/boot_service.py --root work/debian-root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-install-service-evidence
          path: |
            work/debian-service-evidence.json
            work/debian-boot-*.log
      - run: cargo run --release --locked --offline --example writer_load > writer-load.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-load-observation
          path: writer-load.json
