name: Native client experiment
on:
  push:
    paths: ['spikes/m00/native/**', 'client/identity/**', 'crates/credentials/**', '.github/workflows/native-client.yml']
  pull_request:
    paths: ['spikes/m00/native/**', 'client/identity/**', 'crates/credentials/**', '.github/workflows/native-client.yml']
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.1-x86_64-pc-windows-msvc fetch --locked --manifest-path spikes/m00/native/Cargo.toml
      - run: cargo +1.99.1-x86_64-pc-windows-msvc fmt --manifest-path spikes/m00/native/Cargo.toml -- --check
      - run: cargo +1.99.1-x86_64-pc-windows-msvc build --locked --offline --manifest-path spikes/m00/native/Cargo.toml
      - run: cargo +1.99.1-x86_64-pc-windows-msvc clippy --locked --offline --manifest-path spikes/m00/native/Cargo.toml --all-targets -- -D warnings
      - name: Check bundled WebView and blocked remote navigation
        run: |
          New-Item -ItemType Directory -Path work -Force | Out-Null
          python spikes/m00/native/check.py --binary spikes/m00/native/target/debug/bbsbox-native-probe.exe > work/native-client.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-client-evidence
          path: work/native-client.json
