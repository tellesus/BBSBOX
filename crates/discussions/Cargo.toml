[package]
name = "bbsbox-discussions"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bbsbox-credentials = { path = "../credentials" }
bbsbox-event-codec = { path = "../event-codec" }
bbsbox-event-core = { path = "../event-core" }
bbsbox-identity = { path = "../identity" }
bbsbox-storage = { path = "../storage" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rusqlite = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
zeroize = "1"
