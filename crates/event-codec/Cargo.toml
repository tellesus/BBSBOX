[package]
name = "bbsbox-event-codec"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bbsbox-credentials = { path = "../credentials" }
ciborium = "0.2"
coset = "0.4"
ed25519-dalek = "3"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
bbsbox-client-identity = { path = "../../client/identity" }
bbsbox-identity = { path = "../identity" }
bbsbox-storage = { path = "../storage" }
tempfile = "3"
serde_json = "1"
