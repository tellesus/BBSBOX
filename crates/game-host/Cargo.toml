[package]
name = "bbsbox-game-host"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bbsbox-credentials = { path = "../credentials" }
bbsbox-identity = { path = "../identity" }
bbsbox-maintenance = { path = "../maintenance" }
bbsbox-storage = { path = "../storage" }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[dev-dependencies]
rusqlite = "0.41"
