[package]
name = "bbsbox-identity"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bbsbox-storage = { path = "../storage" }
bbsbox-credentials = { path = "../credentials" }
rusqlite = "0.41"
argon2 = { version = "0.6", features = ["zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
subtle = "2"
http = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
bbsbox-client-identity = { path = "../../client/identity" }
