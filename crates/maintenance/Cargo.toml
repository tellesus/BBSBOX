[package]
name = "bbsbox-maintenance"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bbsbox-storage = { path = "../storage" }
bbsbox-identity = { path = "../identity" }
bbsbox-credentials = { path = "../credentials" }
age = { version = "=0.12.1", default-features = false }
tar = { version = "=0.4.46", default-features = false }
coset = "0.4"
ed25519-dalek = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
fs2 = "0.4"

[dev-dependencies]
rusqlite = { version = "0.41", features = ["backup"] }
