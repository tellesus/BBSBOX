[package]
name = "bbsbox-node-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "bbsbox-node"
path = "src/main.rs"

[dependencies]
bbsbox-storage = { path = "../storage" }
bbsbox-discussions = { path = "../discussions" }
bbsbox-event-codec = { path = "../event-codec" }
bbsbox-settings = { path = "../settings" }
bbsbox-identity = { path = "../identity" }
bbsbox-event-core = { path = "../event-core" }
bbsbox-maintenance = { path = "../maintenance" }
bbsbox-mail = { path = "../mail" }
bbsbox-profiles = { path = "../profiles" }
bbsbox-credentials = { path = "../credentials" }
tempfile = "3"
zeroize = "1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
