[package]
name = "bbsbox-storage"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
