[package]
name = "bbsbox-demo-worker"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bbsbox-game-host = { path = "../../crates/game-host" }
hex = "0.4"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["net"] }

[dev-dependencies]
bbsbox-maintenance = { path = "../../crates/maintenance" }
