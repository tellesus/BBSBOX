[package]
name = "bbsbox-mls-experiment"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dev-dependencies]
bbsbox-client-identity = { path = "../../../client/identity" }
bbsbox-credentials = { path = "../../../crates/credentials" }
bbsbox-event-codec = { path = "../../../crates/event-codec" }
bbsbox-private-forum = { path = "../../../crates/private-forum" }
ed25519-dalek = "3"
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
