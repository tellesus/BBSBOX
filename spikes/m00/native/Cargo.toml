[package]
name = "bbsbox-native-probe"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
bbsbox-client-identity = { path = "../../../client/identity" }
bbsbox-client-vault = { path = "../../../client/vault" }
bbsbox-credentials = { path = "../../../crates/credentials" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = [] }
zeroize = "1"

[build-dependencies]
tauri-build = "=2.7.4"
